services:

  postgres:
    image: postgres:16
    container_name: zanora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 369963
      POSTGRES_DB: zanora
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./data:/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: zanora-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  zanora-back:
    build:
      context: ./backend/zanora-back
    container_name: zanora-back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zanora
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 369963
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/zanora_reviews
    ports:
      - "8080:8080"

  price-estimation:
    build:
      context: ./ML/PriceEstimation
    container_name: price-estimation
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/immobilier_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: 369963
      QUARKUS_HTTP_PORT: 8083
    ports:
      - "8083:8083"

  user-satisfaction:
    build:
      context: ./ML/UserSatisfaction
    container_name: user-satisfaction
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: 8084
    ports:
      - "8084:8084"
  backoffice:
    build:
      context: ./frontend/Backoffice
    container_name: backoffice
    restart: unless-stopped
    depends_on:
      - zanora-back
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  mongo_data: