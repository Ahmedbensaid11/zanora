# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=1909
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/immobilier_db

# Hibernate ORM Configuration

quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.database.generation=update
# Connection Pool
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20

# HTTP Configuration
quarkus.http.port=8083
quarkus.http.cors.origins=http://localhost:8081,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.immobilier".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Swagger/OpenAPI Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.theme=flattop

# ML Model Configuration
ml.auto-train-on-startup=true
ml.min-training-samples=50

# Dev Services (disable if you have your own PostgreSQL)
quarkus.devservices.enabled=false

# Production mode settings
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.category."com.immobilier".level=INFO

# Native build configuration (optional)
quarkus.native.additional-build-args=--initialize-at-run-time=smile.math.MathEx